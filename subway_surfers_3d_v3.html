
<h2 class="sr-only">Subway surfers 3D endless runner with low angled camera</h2>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
#wrap{width:100%;max-width:680px;background:#1a0a2e;border-radius:12px;overflow:hidden;position:relative;font-family:'Arial Black',monospace;}
#cv{display:block;width:100%;}
#ui{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none;z-index:5;}
.stat{background:rgba(0,0,0,0.65);border:2px solid rgba(255,210,0,0.7);border-radius:10px;padding:4px 14px;text-align:center;}
.sl{font-size:10px;color:#fc0;letter-spacing:1px;font-weight:bold;}
.sv{font-size:18px;font-weight:900;color:#fff;}
#ov,#dead{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;gap:14px;z-index:10;}
#ov{background:linear-gradient(180deg,#1a0a2e 0%,#0a1a2e 100%);}
#dead{display:none;background:rgba(0,0,0,0.92);}
.gt{font-size:34px;color:#fc0;letter-spacing:3px;font-weight:900;text-shadow:0 0 20px #fc08;}
.info{color:#ccc;font-size:13px;text-align:center;line-height:2;}
.hint{font-size:11px;color:#666;margin-top:-4px;}
.obtn{padding:14px 44px;background:#fc0;color:#000;border:none;border-radius:30px;font-size:17px;font-weight:900;cursor:pointer;letter-spacing:1px;}
.obtn:hover{background:#ffe000;transform:scale(1.05);}
.fsc{font-size:24px;color:#fc0;font-weight:900;}
</style>
<div id="wrap">
  <canvas id="cv" width="680" height="500"></canvas>
  <div id="ui">
    <div class="stat"><div class="sl">SCORE</div><div class="sv" id="sc">0</div></div>
    <div class="stat"><div class="sl">COINS</div><div class="sv" id="cn">0</div></div>
    <div class="stat"><div class="sl">BEST</div><div class="sv" id="hi">0</div></div>
  </div>
  <div id="ov">
    <div class="gt">SUBWAY RUN</div>
    <p class="info">Dodge trains & barriers — collect coins!<br>← → Switch lanes &nbsp;|&nbsp; Up / Space = Jump<br>Down / S = Slide</p>
    <p class="hint">Mobile: swipe to move</p>
    <button class="obtn" id="startBtn">PLAY NOW</button>
  </div>
  <div id="dead">
    <div class="gt">GAME OVER</div>
    <div class="fsc" id="fsc"></div>
    <p class="info" id="fcoins" style="color:#aaa;font-size:14px;"></p>
    <button class="obtn" id="restartBtn">TRY AGAIN</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=680,H=500;

// Camera config — low angle like Subway Surfers
// Horizon sits HIGH on screen so you see lots of track ahead
const HORIZON_Y=H*0.28;
const CAM_HEIGHT=90;
const FOCAL=320;
const GROUND_Z=0;
const ZDEPTH=2200;
const ZNEAR=80;

const LANE_GAP=120;
const LANES=[-LANE_GAP,0,LANE_GAP];

function proj(wx,wy,wz){
  // wy: height above ground (positive = up)
  // wz: depth (larger = farther)
  if(wz<=0)return{x:W/2,y:H,s:0,vis:false};
  const scale=FOCAL/wz;
  const sx=W/2+wx*scale;
  const sy=HORIZON_Y+(CAM_HEIGHT-wy)*scale;
  return{x:sx,y:sy,s:scale,vis:true};
}

let state='menu',frame=0,score=0,coins=0,hiScore=0,speed=8;

let player={
  lane:1,targetLane:1,
  wx:LANES[1],wy:0,wz:120,
  vy:0,jumping:false,
  sliding:false,slideTimer:0,
  invincible:0
};

let obstacles=[],coinObjs=[],particles=[];
let bgTiles=[];

function resetGame(){
  score=0;coins=0;speed=8;frame=0;
  player={lane:1,targetLane:1,wx:LANES[1],wy:0,wz:120,
    vy:0,jumping:false,sliding:false,slideTimer:0,invincible:0};
  obstacles=[];coinObjs=[];particles=[];
  state='playing';
}

function spawnObstacle(){
  const safe=player.targetLane;
  let lanes=[0,1,2].filter(l=>l!==safe);
  // sometimes block 1 lane, sometimes 2 (never all 3)
  const blockCount=Math.random()<0.35&&frame>300?2:1;
  const toBlock=lanes.sort(()=>Math.random()-0.5).slice(0,blockCount);
  toBlock.forEach(lane=>{
    const r=Math.random();
    if(r<0.45){
      obstacles.push({type:'train',lane,wz:ZDEPTH,wy:0,w:88,h:190,depth:120,
        col:'#cc2200',colTop:'#991100',colSide:'#770d00',colDark:'#550900'});
    } else if(r<0.75){
      obstacles.push({type:'barrier',lane,wz:ZDEPTH,wy:0,w:80,h:72,depth:38,
        col:'#ff6600',colTop:'#ff8800',colSide:'#cc4400',colDark:'#aa3300'});
    } else {
      obstacles.push({type:'low',lane,wz:ZDEPTH,wy:0,w:85,h:32,depth:38,
        col:'#ffbb00',colTop:'#ffdd00',colSide:'#cc8800',colDark:'#aa6600'});
    }
  });
}

function spawnCoins(){
  const lane=Math.floor(Math.random()*3);
  const count=4+Math.floor(Math.random()*4);
  for(let i=0;i<count;i++){
    coinObjs.push({lane,wz:ZDEPTH+i*100,wy:55,collected:false});
  }
}

function drawSky(){
  // Deep purple-blue night sky
  ctx.fillStyle='#100820';ctx.fillRect(0,0,W,HORIZON_Y+2);
  // stars
  ctx.fillStyle='#fff';
  for(let i=0;i<120;i++){
    const sx=(i*179.3)%W, sy=(i*83.7)%(HORIZON_Y);
    const br=i%8===0?2:1;
    ctx.globalAlpha=0.3+Math.abs(Math.sin(i+frame*0.02))*0.5;
    ctx.fillRect(sx,sy,br,br);
  }
  ctx.globalAlpha=1;
  // City horizon glow
  ctx.fillStyle='rgba(255,120,0,0.08)';
  ctx.fillRect(0,HORIZON_Y-18,W,20);
  // City buildings silhouette
  ctx.fillStyle='#0d0820';
  const bH=[50,90,130,70,110,160,80,140,60,100,120,75,95,50,85];
  bH.forEach((h,i)=>{
    const bx=i*(W/14.5);
    ctx.fillRect(bx,HORIZON_Y-h,W/14.5-1,h);
    ctx.fillStyle='rgba(255,220,80,0.2)';
    for(let wy2=HORIZON_Y-h+6;wy2<HORIZON_Y-4;wy2+=10){
      for(let wx2=bx+3;wx2<bx+W/14.5-3;wx2+=8){
        if(Math.sin(wx2*11+wy2*7+i)>0.5)ctx.fillRect(wx2,wy2,4,6);
      }
    }
    ctx.fillStyle='#0d0820';
  });
}

function drawGround(){
  // Ground fill
  ctx.fillStyle='#1a1208';
  ctx.beginPath();
  ctx.moveTo(0,HORIZON_Y);ctx.lineTo(W,HORIZON_Y);ctx.lineTo(W,H);ctx.lineTo(0,H);
  ctx.fill();

  // Track surface — draw quad strips from near to far
  for(let z=ZNEAR;z<ZDEPTH;z+=50){
    const z2=z+50;
    const p1=proj(-360,0,z),p2=proj(360,0,z);
    const p3=proj(360,0,z2),p4=proj(-360,0,z2);
    const fog=z/ZDEPTH;
    const r=Math.round(lerp(55,18,fog));
    const g=Math.round(lerp(50,16,fog));
    const b=Math.round(lerp(45,14,fog));
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
    ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.closePath();ctx.fill();
  }

  // Sleeper ties
  for(let i=0;i<28;i++){
    const z=ZNEAR+((i*80+frame*speed)%( ZDEPTH-ZNEAR));
    const p1=proj(-360,1,z),p2=proj(360,1,z);
    const p3=proj(360,1,z+16),p4=proj(-360,1,z+16);
    const fog=z/ZDEPTH;
    const c=Math.round(lerp(42,12,fog));
    ctx.fillStyle=`rgb(${c+8},${c+4},${c})`;
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
    ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.closePath();ctx.fill();
  }

  // Rails (3 lanes x 2 rails each)
  LANES.forEach(lx=>{
    [-16,16].forEach(rx=>{
      const railX=lx+rx;
      const rt=proj(railX,3,ZNEAR),rb=proj(railX,3,ZDEPTH);
      const rt2=proj(railX+5,3,ZNEAR),rb2=proj(railX+5,3,ZDEPTH);
      ctx.fillStyle='#aaa';
      ctx.beginPath();ctx.moveTo(rt.x,rt.y);ctx.lineTo(rt2.x,rt2.y);
      ctx.lineTo(rb2.x,rb2.y);ctx.lineTo(rb.x,rb.y);ctx.closePath();ctx.fill();
    });
  });

  // Lane dividers
  [-LANE_GAP/2-LANE_GAP/2,LANE_GAP/2,LANE_GAP/2+LANE_GAP/2].slice(0,2).forEach(lx=>{
    const divX=lx+LANE_GAP/2;
    for(let j=0;j<16;j++){
      const z=ZNEAR+((j*140+frame*speed*0.8)%(ZDEPTH-ZNEAR));
      const p1=proj(divX-2,2,z),p2=proj(divX+2,2,z);
      const p3=proj(divX+2,2,z+70),p4=proj(divX-2,2,z+70);
      const fog=z/ZDEPTH;
      ctx.fillStyle=`rgba(255,255,255,${lerp(0.3,0.05,fog)})`;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
      ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.closePath();ctx.fill();
    }
  });

  // Side walls / tunnel pillars
  [-380,380].forEach((wx,si)=>{
    // Wall
    for(let z=ZNEAR;z<ZDEPTH;z+=90){
      const fog=z/ZDEPTH;
      const c=Math.round(lerp(40,10,fog));
      const p1=proj(wx,-200,z),p2=proj(wx+20*(si?-1:1),-200,z);
      const p3=proj(wx+20*(si?-1:1),0,z),p4=proj(wx,0,z);
      ctx.fillStyle=`rgb(${c+10},${c},${c})`;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
      ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.closePath();ctx.fill();
    }
    // Pillars
    for(let j=0;j<10;j++){
      const z=ZNEAR+((j*220+frame*speed*0.5)%(ZDEPTH-ZNEAR));
      if(z>=ZDEPTH)continue;
      const fog=z/ZDEPTH;
      const c=Math.round(lerp(70,20,fog));
      const pw=18,ph=220;
      const p1=proj(wx-pw/2,-ph,z),p2=proj(wx+pw/2,-ph,z);
      const p3=proj(wx+pw/2,0,z),p4=proj(wx-pw/2,0,z);
      ctx.fillStyle=`rgb(${c},${c-5},${c-10})`;
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
      ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.closePath();ctx.fill();
      // Yellow stripe on pillar
      const ps1=proj(wx-pw/2,-ph,z),ps2=proj(wx+pw/2,-ph,z);
      const ps3=proj(wx+pw/2,-ph+12,z),ps4=proj(wx-pw/2,-ph+12,z);
      ctx.fillStyle=`rgba(255,200,0,${lerp(0.8,0.1,fog)})`;
      ctx.beginPath();ctx.moveTo(ps1.x,ps1.y);ctx.lineTo(ps2.x,ps2.y);
      ctx.lineTo(ps3.x,ps3.y);ctx.lineTo(ps4.x,ps4.y);ctx.closePath();ctx.fill();
    }
  });

  // Overhead lights
  for(let j=0;j<8;j++){
    const z=ZNEAR+((j*280+frame*speed*0.5)%(ZDEPTH-ZNEAR));
    if(z>=ZDEPTH)continue;
    const fog=z/ZDEPTH;
    const p=proj(0,-240,z);
    if(!p.vis)continue;
    const r=Math.max(2,14*p.s);
    ctx.fillStyle=`rgba(255,240,180,${lerp(0.9,0.1,fog)})`;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    // Light cone
    const lc=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,60*p.s);
    lc.addColorStop(0,`rgba(255,240,180,${lerp(0.15,0.02,fog)})`);
    lc.addColorStop(1,'rgba(255,240,180,0)');
    ctx.fillStyle=lc;
    ctx.beginPath();ctx.arc(p.x,p.y,60*p.s,0,Math.PI*2);ctx.fill();
  }
}

function draw3DBox(wx,wy,wz,w,h,depth,fc,tc,sc2,outline){
  const hw=w/2,hd=depth/2;
  const zf=wz-hd,zb=wz+hd;
  if(zf<4)return null;
  const fl=proj(wx-hw,wy,zf),fr=proj(wx+hw,wy,zf);
  const bl=proj(wx-hw,wy,zb),br=proj(wx+hw,wy,zb);
  const flt=proj(wx-hw,wy+h,zf),frt=proj(wx+hw,wy+h,zf);
  const blt=proj(wx-hw,wy+h,zb),brt=proj(wx+hw,wy+h,zb);
  if(!fl.vis||!fr.vis)return null;

  // back face (darker)
  ctx.fillStyle=outline||'#222';
  ctx.beginPath();ctx.moveTo(bl.x,bl.y);ctx.lineTo(br.x,br.y);
  ctx.lineTo(brt.x,brt.y);ctx.lineTo(blt.x,blt.y);ctx.closePath();ctx.fill();
  // side face
  ctx.fillStyle=sc2;
  ctx.beginPath();ctx.moveTo(fr.x,fr.y);ctx.lineTo(br.x,br.y);
  ctx.lineTo(brt.x,brt.y);ctx.lineTo(frt.x,frt.y);ctx.closePath();ctx.fill();
  // front face
  ctx.fillStyle=fc;
  ctx.beginPath();ctx.moveTo(fl.x,fl.y);ctx.lineTo(fr.x,fr.y);
  ctx.lineTo(frt.x,frt.y);ctx.lineTo(flt.x,flt.y);ctx.closePath();ctx.fill();
  // top face
  ctx.fillStyle=tc;
  ctx.beginPath();ctx.moveTo(flt.x,flt.y);ctx.lineTo(frt.x,frt.y);
  ctx.lineTo(brt.x,brt.y);ctx.lineTo(blt.x,blt.y);ctx.closePath();ctx.fill();
  // edges
  ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(fl.x,fl.y);ctx.lineTo(fr.x,fr.y);ctx.lineTo(frt.x,frt.y);ctx.lineTo(flt.x,flt.y);ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.moveTo(flt.x,flt.y);ctx.lineTo(blt.x,blt.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(frt.x,frt.y);ctx.lineTo(brt.x,brt.y);ctx.stroke();
  return{fl,fr,flt,frt,bl,br,blt,brt,sc:fl.s};
}

function drawObstacles(){
  const sorted=[...obstacles].sort((a,b)=>b.wz-a.wz);
  sorted.forEach(ob=>{
    if(ob.wz<ZNEAR-60)return;
    const wx=LANES[ob.lane];
    const faces=draw3DBox(wx,ob.wy,ob.wz,ob.w,ob.h,ob.depth,ob.col,ob.colTop,ob.colSide,ob.colDark);
    if(!faces)return;
    const sc=faces.sc;

    if(ob.type==='train'){
      // Windows on front face
      const fw=ob.w*sc,fh=ob.h*sc;
      const cx=(faces.fl.x+faces.fr.x)/2;
      const cy=faces.flt.y;
      // window rows
      ctx.fillStyle='rgba(100,210,255,0.85)';
      for(let row=0;row<3;row++){
        const wy2=faces.flt.y+(faces.fl.y-faces.flt.y)*(0.15+row*0.27);
        const wh2=fh*0.18;
        [-1,1].forEach(side=>{
          ctx.fillRect(cx+side*fw*0.2-fw*0.12,wy2,fw*0.24,wh2);
          // window glare
          ctx.fillStyle='rgba(255,255,255,0.3)';
          ctx.fillRect(cx+side*fw*0.2-fw*0.12,wy2,fw*0.06,wh2);
          ctx.fillStyle='rgba(100,210,255,0.85)';
        });
      }
      // Front light
      ctx.fillStyle='rgba(255,240,150,0.95)';
      ctx.beginPath();ctx.arc(cx,faces.fl.y-(fh*0.06),fh*0.05,0,Math.PI*2);ctx.fill();
      // Train number
      ctx.fillStyle='#fff';ctx.font=`bold ${Math.round(10*sc)}px Arial`;ctx.textAlign='center';
      ctx.fillText('003',cx,faces.flt.y+fh*0.08);
      // Red stripe
      ctx.fillStyle='#ff4400';
      ctx.fillRect(faces.fl.x,faces.flt.y+fh*0.1,fw,fh*0.04);

    } else if(ob.type==='barrier'){
      const fw=ob.w*sc,fh=ob.h*sc;
      const cx=(faces.fl.x+faces.fr.x)/2;
      // Warning stripes on front
      ctx.save();
      ctx.beginPath();ctx.moveTo(faces.fl.x,faces.fl.y);ctx.lineTo(faces.fr.x,faces.fr.y);
      ctx.lineTo(faces.frt.x,faces.frt.y);ctx.lineTo(faces.flt.x,faces.flt.y);ctx.closePath();ctx.clip();
      for(let s=-4;s<6;s++){
        ctx.fillStyle=s%2===0?'rgba(0,0,0,0.3)':'rgba(255,255,255,0.2)';
        ctx.fillRect(faces.fl.x+s*fw*0.22,faces.flt.y,fw*0.22,fh+4);
      }
      ctx.restore();
      // Border
      ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.strokeRect(faces.fl.x+2,faces.flt.y+2,fw-4,fh-4);
      // STOP text
      ctx.fillStyle='#fff';ctx.font=`bold ${Math.round(9*sc)}px Arial`;ctx.textAlign='center';
      ctx.fillText('STOP',cx,faces.flt.y+fh*0.6);

    } else {
      // Low barrier — bright yellow warning
      const fw=ob.w*sc,fh=ob.h*sc;
      const cx=(faces.fl.x+faces.fr.x)/2;
      // black warning stripes
      ctx.save();
      ctx.beginPath();ctx.moveTo(faces.fl.x,faces.fl.y);ctx.lineTo(faces.fr.x,faces.fr.y);
      ctx.lineTo(faces.frt.x,faces.frt.y);ctx.lineTo(faces.flt.x,faces.flt.y);ctx.closePath();ctx.clip();
      for(let s=-3;s<5;s++){
        ctx.fillStyle=s%2===0?'rgba(0,0,0,0.35)':'rgba(255,255,255,0.1)';
        ctx.fillRect(faces.fl.x+s*fw*0.25,faces.flt.y,fw*0.25,fh+4);
      }
      ctx.restore();
      ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(faces.fl.x,faces.fl.y);ctx.lineTo(faces.fr.x,faces.fr.y);
      ctx.lineTo(faces.frt.x,faces.frt.y);ctx.lineTo(faces.flt.x,faces.flt.y);ctx.closePath();ctx.stroke();
    }
  });
}

function drawCoins(){
  const sorted=[...coinObjs].filter(c=>!c.collected).sort((a,b)=>b.wz-a.wz);
  sorted.forEach(c=>{
    if(c.wz<ZNEAR)return;
    const wx=LANES[c.lane];
    const p=proj(wx,c.wy,c.wz);
    if(!p.vis)return;
    const r=Math.max(4,10*p.s);
    const bob=Math.sin(frame*0.12+c.wz)*3;
    // shadow
    const ps=proj(wx,1,c.wz);
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(ps.x,ps.y,r*0.8,r*0.2,0,0,Math.PI*2);ctx.fill();
    // coin body
    ctx.fillStyle='#fc0';
    ctx.beginPath();ctx.arc(p.x,p.y+bob,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffe044';
    ctx.beginPath();ctx.arc(p.x-r*0.22,p.y+bob-r*0.22,r*0.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#cc8800';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(p.x,p.y+bob,r,0,Math.PI*2);ctx.stroke();
    // $ symbol
    if(r>7){
      ctx.fillStyle='#cc7700';ctx.font=`bold ${Math.round(r)}px Arial`;ctx.textAlign='center';
      ctx.fillText('$',p.x,p.y+bob+r*0.35);
    }
  });
}

function drawPlayer(){
  const p=player;
  if(p.invincible>0&&Math.floor(frame*0.15)%2===0)return;
  const sc=FOCAL/p.wz;
  const px=W/2+p.wx*sc;
  const groundY=HORIZON_Y+(CAM_HEIGHT)*sc;
  const jumpOff=p.wy*sc;
  const base=groundY-jumpOff;
  const slide=p.sliding;
  const ph=slide?36*sc:70*sc;
  const pw=28*sc;

  // shadow on ground
  const sg=proj(p.wx,1,p.wz);
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.ellipse(sg.x,sg.y,pw*0.9,8*sc,0,0,Math.PI*2);ctx.fill();

  ctx.save();ctx.translate(px,base);

  if(!slide){
    // legs
    const legSwing=Math.sin(frame*0.38)*16*sc;
    ctx.fillStyle='#2244cc';
    ctx.fillRect(-pw*0.5+2*sc,-ph*0.5+legSwing,pw*0.42,ph*0.52);
    ctx.fillRect(pw*0.08-2*sc,-ph*0.5-legSwing,pw*0.42,ph*0.52);
    // shoes
    ctx.fillStyle='#eee';
    ctx.fillRect(-pw*0.5-2*sc,-4*sc+legSwing,pw*0.44+4*sc,9*sc);
    ctx.fillRect(pw*0.08-4*sc,-4*sc-legSwing,pw*0.44+4*sc,9*sc);
    // body
    ctx.fillStyle='#ff3311';
    ctx.fillRect(-pw/2,-ph+4*sc,pw,ph*0.56);
    // hoodie stripe
    ctx.fillStyle='#fff';ctx.fillRect(-pw/2,-ph*0.55,pw,4*sc);
    // arms swing
    const armSwing=Math.sin(frame*0.38+Math.PI)*20*sc;
    ctx.fillStyle='#ff3311';
    ctx.save();ctx.translate(-pw/2,-ph*0.72);ctx.rotate(armSwing*Math.PI/180);
    ctx.fillRect(-16*sc,-5*sc,16*sc,9*sc);ctx.restore();
    ctx.save();ctx.translate(pw/2,-ph*0.72);ctx.rotate(-armSwing*Math.PI/180);
    ctx.fillRect(0,-5*sc,16*sc,9*sc);ctx.restore();
    // head
    ctx.fillStyle='#f5b887';
    ctx.beginPath();ctx.arc(0,-ph-10*sc,15*sc,0,Math.PI*2);ctx.fill();
    // cap
    ctx.fillStyle='#1133aa';
    ctx.fillRect(-16*sc,-ph-24*sc,32*sc,14*sc);
    ctx.fillRect(-20*sc,-ph-14*sc,8*sc,6*sc); // brim
    // eyes
    ctx.fillStyle='#111';
    ctx.fillRect(-8*sc,-ph-12*sc,5*sc,5*sc);
    ctx.fillRect(3*sc,-ph-12*sc,5*sc,5*sc);
    // backpack
    ctx.fillStyle='#22bb44';
    ctx.fillRect(pw/2-2*sc,-ph+8*sc,11*sc,30*sc);
    ctx.fillStyle='#1a9933';ctx.fillRect(pw/2,-ph+14*sc,6*sc,14*sc);
  } else {
    // Sliding — body low
    ctx.fillStyle='#2244cc';ctx.fillRect(-pw/2-4*sc,-ph,pw+8*sc,ph*0.6);
    ctx.fillStyle='#ff3311';ctx.fillRect(-pw/2,-ph,pw,ph*0.5);
    ctx.fillStyle='#f5b887';
    ctx.beginPath();ctx.arc(pw/2+12*sc,-ph*0.55,12*sc,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1133aa';ctx.fillRect(pw/2+2*sc,-ph*0.55-12*sc,22*sc,10*sc);
  }
  ctx.restore();
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function lerp(a,b,t){return a+(b-a)*t;}

function update(){
  if(state!=='playing')return;
  frame++;
  score+=Math.round(speed/3);
  speed=Math.min(8+frame*0.005,26);

  // Smooth lane switch
  const txw=LANES[player.targetLane];
  player.wx+=(txw-player.wx)*0.14;

  // Jump physics
  if(player.jumping){
    player.vy-=1.1;
    player.wy+=player.vy;
    if(player.wy<=0){player.wy=0;player.jumping=false;player.vy=0;}
  }

  // Slide
  if(player.sliding){player.slideTimer--;if(player.slideTimer<=0)player.sliding=false;}
  if(player.invincible>0)player.invincible--;

  // Spawn
  if(frame%Math.max(48,105-frame*0.045|0)===0)spawnObstacle();
  if(frame%88===0)spawnCoins();

  // Move world toward camera
  obstacles.forEach(ob=>{ob.wz-=speed;});
  coinObjs.forEach(c=>{c.wz-=speed;});
  obstacles=obstacles.filter(ob=>ob.wz>ZNEAR-80);
  coinObjs=coinObjs.filter(c=>c.wz>ZNEAR-40&&!c.collected);

  // Collision detection
  if(player.invincible<=0){
    for(let ob of obstacles){
      const lm=Math.abs(player.wx-LANES[ob.lane])<60;
      const zm=ob.wz<200&&ob.wz>90;
      if(!lm||!zm)continue;
      if(ob.type==='train'){
        gameOver();return;
      } else if(ob.type==='barrier'){
        if(!player.jumping||player.wy<20){gameOver();return;}
      } else {
        if(!player.sliding){gameOver();return;}
      }
    }
  }

  // Coins
  coinObjs.forEach(c=>{
    if(c.collected)return;
    const lm=Math.abs(player.wx-LANES[c.lane])<50;
    const zm=c.wz<220&&c.wz>100;
    if(lm&&zm){
      c.collected=true;coins++;
      const p2=proj(LANES[c.lane],c.wy,c.wz);
      for(let i=0;i<8;i++) particles.push({x:p2.x,y:p2.y,vx:(Math.random()-0.5)*5,vy:-Math.random()*4-1,life:1,r:4,col:'#fc0'});
    }
  });

  // Particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life-=0.04;p.r*=0.95;});
  particles=particles.filter(p=>p.life>0);

  document.getElementById('sc').textContent=score;
  document.getElementById('cn').textContent=coins;
  document.getElementById('hi').textContent=hiScore;
}

function gameOver(){
  if(score>hiScore)hiScore=score;
  document.getElementById('fsc').textContent='Score: '+score;
  document.getElementById('fcoins').textContent='Coins collected: '+coins;
  document.getElementById('dead').style.display='flex';
  state='dead';
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawSky();
  drawGround();
  drawCoins();
  drawObstacles();
  drawParticles();
  drawPlayer();
}

function loop(){update();draw();requestAnimationFrame(loop);}

function moveLeft(){if(state==='playing'&&player.targetLane>0)player.targetLane--;}
function moveRight(){if(state==='playing'&&player.targetLane<2)player.targetLane++;}
function doJump(){if(state==='playing'&&!player.jumping){player.jumping=true;player.vy=18;player.sliding=false;}}
function doSlide(){if(state==='playing'&&!player.jumping){player.sliding=true;player.slideTimer=50;}}

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  if(state!=='playing')return;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')moveLeft();
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')moveRight();
  if(e.key==='ArrowUp'||e.key===' '||e.key==='w'||e.key==='W')doJump();
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')doSlide();
});

let tx0=0,ty0=0;
cv.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>Math.abs(dy)){dx<-20?moveLeft():dx>20?moveRight():null;}
  else{dy<-20?doJump():dy>20?doSlide():null;}
},{passive:true});

document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('ov').style.display='none';
  resetGame();
});
document.getElementById('restartBtn').addEventListener('click',()=>{
  document.getElementById('dead').style.display='none';
  resetGame();
});

loop();
</script>
